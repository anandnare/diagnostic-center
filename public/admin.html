<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin पॅनेल</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 30px; }
    th, td { padding: 10px; border: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
    th { background: #0b6e99; color: #fff; }
    .scroll { overflow-x: auto; }
    .del { background: #dc2626; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; }
.badge.Pending { background: #fef3c7; color: #92400e; }
.badge.Done { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <div id="header"></div>
  <section><div class="container">

    <form id="loginForm">
      <h2 class="title">Admin लॉगिन</h2>
      <label>पासवर्ड</label>
      <input type="password" id="password" required>
      <button class="btn primary" type="submit">लॉगिन</button>
      <div id="msg" class="msg"></div>
    </form>

    <div id="panel" style="display:none">
      <h2 class="title">अपॉइंटमेंट्स</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>नाव</th><th>मोबाईल</th><th>तारीख</th><th>प्रकार</th><th>टेस्ट</th><th>डिलीट</th></tr></thead>
          <tbody id="apTable"></tbody>
        </table>
      </div>

      <h2 class="title">संपर्क संदेश</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>नाव</th><th>मोबाईल</th><th>तारीख</th><th>प्रकार</th><th>टेस्ट</th><th>स्टेटस</th><th>डिलीट</th></tr></thead>
          <tbody id="msgTable"></tbody>
        </table>
      </div>
    </div>

  </div></section>
  <div id="footer"></div>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
